<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="bio-title"><title id="bio-title">Second-year electrical engineering student at UBC, interested in ASICs, FPGAs, verification and IP development. Also into flying FPV drones, CFD and microsoldering. Main language: SystemVerilog. Also C, Bash, some Python and Lua.</title><style>text{animation:arrive .8s cubic-bezier(.2,.7,.3,1) both}@keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){text{animation:none}}
@supports (-moz-appearance:none){text{animation-name:firefox-fade;transform:none}}
@keyframes firefox-fade{from{opacity:0}to{opacity:1}}</style><text x="4" y="56" style="animation-delay:0.11s" font-family="Segoe UI,sans-serif" font-size="32" fill="#e6edf3">I'm a second-year electrical</text><text x="4" y="96" style="animation-delay:0.19s" font-family="Segoe UI,sans-serif" font-size="32" fill="#e6edf3">engineering student at UBC.</text><text x="4" y="153" style="animation-delay:0.31s" font-family="Segoe UI,sans-serif" font-size="18" fill="#9ba9bb">Interested in ASICs, FPGAs, verification and IP development.</text><text x="4" y="189" style="animation-delay:0.38s" font-family="Segoe UI,sans-serif" font-size="18" fill="#9ba9bb">I'm also into flying FPV drones, CFD and microsoldering.</text><text x="4" y="241" font-family="monospace" font-size="14" fill="#91bfff">SystemVerilog · C · Bash</text><text x="4" y="267" font-family="Segoe UI,sans-serif" font-size="15" fill="#9ba9bb">Some Python and Lua.</text></svg>