name: Refresh contribution calendar

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-calendar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate contribution artwork
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          python scripts/update_contributions.py
      - name: Commit refreshed calendar
        run: |
          if git diff --quiet -- assets README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/calendar-*.svg README.md
          git commit -m 'Refresh contribution calendar'
          git push
