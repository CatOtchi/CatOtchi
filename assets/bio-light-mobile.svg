<svg xmlns="http://www.w3.org/2000/svg" width="420" height="385" viewBox="0 0 420 385" role="img" aria-labelledby="bio-title"><title id="bio-title">Second-year electrical engineering student at UBC, interested in ASICs, FPGAs, verification and IP development. Also into flying FPV drones, CFD and microsoldering. Main language: SystemVerilog. Also C, Bash, some Python and Lua.</title><style>text{animation:arrive .98s cubic-bezier(.2,.7,.3,1) both}@keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){text{animation:none}}
@supports (-moz-appearance:none){text{animation-name:firefox-fade;transform:none}}
@keyframes firefox-fade{from{opacity:0}to{opacity:1}}</style><text x="4" y="56" style="animation-delay:1.70s" font-family="Segoe UI,sans-serif" font-size="28" fill="#1f2328">I'm a second-year electrical</text><text x="4" y="96" style="animation-delay:1.95s" font-family="Segoe UI,sans-serif" font-size="28" fill="#1f2328">engineering student at UBC.</text><text x="4" y="153" style="animation-delay:2.20s" font-family="Segoe UI,sans-serif" font-size="18" fill="#59636e">Interested in ASICs, FPGAs,</text><text x="4" y="181" style="animation-delay:2.45s" font-family="Segoe UI,sans-serif" font-size="18" fill="#59636e">verification and IP development.</text><text x="4" y="217" style="animation-delay:2.70s" font-family="Segoe UI,sans-serif" font-size="18" fill="#59636e">I'm also into flying FPV drones,</text><text x="4" y="245" style="animation-delay:2.95s" font-family="Segoe UI,sans-serif" font-size="18" fill="#59636e">CFD and microsoldering.</text><text x="4" y="297" font-family="monospace" font-size="14" fill="#0969da" style="animation-delay:3.20s">SystemVerilog · C · Bash</text><text x="4" y="323" font-family="Segoe UI,sans-serif" font-size="15" fill="#59636e" style="animation-delay:3.45s">Some Python and Lua.</text></svg>